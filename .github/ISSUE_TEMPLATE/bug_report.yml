name: Bug report
description: It crashed, failed, or printed something wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Flagged something that's actually in use? Use **False positive** instead.
        Before pasting output, remove account IDs, ARNs and names you don't want public.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `zombie-scanner version`.
      placeholder: zombie-scanner 0.3.1 (abc1234)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Release download
        - Linux package (deb, rpm, apk)
        - go install
        - GitHub Action
        - Built from source
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Run again with `--log-level debug` for more detail.
      render: text
